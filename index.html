<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="eichiaiが制作・公開しているアプリの一覧です。"
    >
    <meta name="theme-color" content="#f7f7f4">
    <title>eichiai | アプリ一覧</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./" aria-label="eichiai ホーム">eichiai</a>
      <a
        class="github-link"
        href="https://github.com/eichiai2026"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub <span aria-hidden="true">↗</span>
      </a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="label">個人アプリ開発</p>
        <h1 id="page-title">暮らしに役立つ、<br>小さなアプリ。</h1>
        <p class="intro-copy">
          日々のちょっとした不便を解決するアプリを制作・公開しています。
        </p>
      </section>

      <section class="apps" aria-labelledby="apps-title">
        <div class="section-header">
          <h2 id="apps-title">アプリ一覧</h2>
          <span>1件</span>
        </div>

        <div class="app-list">
          <a
            class="app-item"
            href="https://subscrapp.eichiai81.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="サブマネを開く（新しいタブ）"
          >
            <div class="app-icon" aria-hidden="true">サ</div>
            <div class="app-info">
              <p class="app-status">公開中</p>
              <h3>サブマネ</h3>
              <p>利用中のサブスクリプションと支払日をまとめて管理できます。</p>
            </div>
            <span class="app-number" aria-hidden="true">01&nbsp;&nbsp;↗</span>
          </a>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 eichiai</p>
      <p>個人で企画・開発しています。</p>
    </footer>
  </body>
</html>
